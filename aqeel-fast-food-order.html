<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aqeel Fast Food — Order</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap');

  :root {
    --red: #E8192C;
    --yellow: #FFD600;
    --dark: #111111;
    --card: #1A1A1A;
    --border: #2A2A2A;
    --text: #F0F0F0;
    --muted: #888;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, #1a0000 0%, #2d0000 50%, #1a0000 100%);
    border-bottom: 3px solid var(--red);
    padding: 1.5rem 1rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 50% 50%, rgba(232,25,44,0.08) 0%, transparent 60%);
    pointer-events: none;
  }
  .logo-text {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 52px;
    color: var(--yellow);
    letter-spacing: 4px;
    line-height: 1;
    text-shadow: 3px 3px 0 var(--red);
  }
  .logo-sub {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    color: var(--red);
    letter-spacing: 8px;
    margin-top: 2px;
  }
  .header-info {
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .badge {
    background: var(--red);
    color: white;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
    letter-spacing: 0.5px;
  }
  .badge.yellow { background: var(--yellow); color: #111; }

  /* MAIN */
  .container { max-width: 700px; margin: 0 auto; padding: 1.5rem 1rem 6rem; }

  /* SECTION */
  .section { margin-bottom: 1.5rem; }
  .section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 3px;
    color: var(--yellow);
    border-left: 4px solid var(--red);
    padding-left: 12px;
    margin-bottom: 10px;
  }
  .section-title-text { flex: 1; }

  /* Section toggle button (View Items / Hide Items) */
  .section-toggle-btn {
    background: #222;
    border: 1px solid #333;
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
  }
  .section-toggle-btn:hover { border-color: #555; }
  .section-toggle-btn.active {
    background: var(--red);
    border-color: var(--red);
    color: white;
  }

  /* ITEM CARD */
  .item-grid { display: none; flex-direction: column; gap: 6px; }
  .item-grid.open { display: flex; }
  .item-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    user-select: none;
  }
  .item-card:hover { border-color: #444; }
  .item-card.selected {
    border-color: var(--red);
    background: #1f0a0a;
  }

  /* Custom checkbox */
  .cb-box {
    width: 20px; height: 20px;
    border: 2px solid #444;
    border-radius: 5px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .item-card.selected .cb-box {
    background: var(--red);
    border-color: var(--red);
  }
  .cb-box svg { display: none; }
  .item-card.selected .cb-box svg { display: block; }

  .item-info { flex: 1; }
  .item-name { font-size: 14px; font-weight: 500; color: var(--text); }
  .item-price { font-size: 13px; color: var(--red); font-weight: 600; margin-top: 2px; }

  /* SIZE selector */
  .size-row {
    display: none;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }
  .item-card.selected .size-row { display: flex; }
  .size-btn {
    background: #222;
    border: 1px solid #333;
    color: var(--text);
    font-size: 12px;
    font-weight: 500;
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .size-btn:hover { border-color: #555; }
  .size-btn.active { background: var(--red); border-color: var(--red); color: white; }

  /* QTY */
  .qty-row {
    display: none;
    align-items: center;
    gap: 10px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }
  .item-card.selected .qty-row { display: flex; }
  .qty-label { font-size: 12px; color: var(--muted); }
  .qty-ctrl { display: flex; align-items: center; gap: 8px; }
  .qty-btn {
    width: 28px; height: 28px;
    background: #222;
    border: 1px solid #333;
    color: white;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .qty-btn:hover { background: var(--red); border-color: var(--red); }
  .qty-num { font-size: 15px; font-weight: 600; min-width: 20px; text-align: center; }

  /* STICKY BOTTOM */
  .sticky-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #0d0d0d;
    border-top: 2px solid var(--red);
    padding: 12px 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    z-index: 100;
  }
  .total-box { display: flex; flex-direction: column; }
  .total-label { font-size: 11px; color: var(--muted); letter-spacing: 0.5px; }
  .total-amount { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--yellow); letter-spacing: 1px; }
  .order-btn {
    background: var(--red);
    color: white;
    font-size: 15px;
    font-weight: 600;
    padding: 12px 28px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.2s, transform 0.1s;
    flex-shrink: 0;
  }
  .order-btn:hover { background: #c0101f; }
  .order-btn:active { transform: scale(0.97); }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #1a1a1a;
    border: 1px solid var(--border);
    border-radius: 20px 20px 0 0;
    padding: 1.5rem 1.5rem 2rem;
    width: 100%;
    max-width: 700px;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal h3 { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: var(--yellow); letter-spacing: 2px; margin-bottom: 1rem; }
  .modal-field { margin-bottom: 12px; }
  .modal-field label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  .modal-field input, .modal-field textarea {
    width: 100%;
    background: #111;
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 8px;
    outline: none;
    font-family: 'Inter', sans-serif;
    transition: border-color 0.2s;
  }
  .modal-field input:focus, .modal-field textarea:focus { border-color: var(--red); }
  .modal-field textarea { resize: none; height: 70px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 1rem; }
  .btn-cancel {
    flex: 1;
    background: #222;
    border: 1px solid #333;
    color: var(--text);
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-confirm {
    flex: 2;
    background: #25D366;
    border: none;
    color: white;
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-confirm:hover { background: #1fb855; }

  .empty-msg {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 1rem 0;
    display: none;
  }
  .item-count-badge {
    background: var(--red);
    color: white;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 10px;
    margin-left: 8px;
    vertical-align: middle;
  }
</style>

const selected = {}; // id -> { name, qty, size, price }

// ========== RENDER ==========
function renderMenu() {
  const container = document.getElementById('menuContainer');
  container.innerHTML = '';

  menu.forEach(section => {
    const sec = document.createElement('div');
    sec.className = 'section';

    // item grid built first so the toggle button's closure can reference it
    const grid = document.createElement('div');
    grid.className = 'item-grid'; // hidden by default (no "open" class)

    const title = document.createElement('div');
    title.className = 'section-title';

    const titleText = document.createElement('span');
    titleText.className = 'section-title-text';
    titleText.textContent = section.section;

    const toggleBtn = document.createElement('button');
    toggleBtn.className = 'section-toggle-btn';
    toggleBtn.type = 'button';
    toggleBtn.textContent = 'View Items';
    toggleBtn.onclick = () => {
      const isOpen = grid.classList.toggle('open');
      toggleBtn.classList.toggle('active', isOpen);
      toggleBtn.textContent = isOpen ? 'Hide Items' : 'View Items';
    };

    title.appendChild(titleText);
    title.appendChild(toggleBtn);
    sec.appendChild(title);

    section.items.forEach(item => {
      const hasSize = !!item.sizes;
      const card = document.createElement('div');
      card.className = 'item-card';
      card.id = 'card-' + item.id;

      const priceText = hasSize
        ? `S: Rs.${item.sizes.S} / M: Rs.${item.sizes.M} / L: Rs.${item.sizes.L} / XL: Rs.${item.sizes.XL}`
        : `Rs.${item.price}`;

      card.innerHTML = `
        <div class="cb-box">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2 6l3 3 5-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="item-info">
          <div class="item-name">${item.name}</div>
          <div class="item-price">${priceText}</div>
          ${hasSize ? `
          <div class="size-row" id="size-${item.id}">
            ${Object.entries(item.sizes).map(([s,p]) => `<button class="size-btn" data-size="${s}" data-price="${p}" onclick="selectSize(event,'${item.id}','${s}',${p})">${s} – Rs.${p}</button>`).join('')}
          </div>` : ''}
          <div class="qty-row" id="qty-${item.id}">
            <span class="qty-label">Qty:</span>
            <div class="qty-ctrl">
              <button class="qty-btn" onclick="changeQty(event,'${item.id}',-1)">−</button>
              <span class="qty-num" id="qnum-${item.id}">1</span>
              <button class="qty-btn" onclick="changeQty(event,'${item.id}',1)">+</button>
            </div>
          </div>
        </div>
      `;

      card.addEventListener('click', (e) => {
        if (e.target.closest('.size-btn') || e.target.closest('.qty-btn')) return;
        toggleItem(item, hasSize);
      });

      grid.appendChild(card);
    });

    sec.appendChild(grid);
    container.appendChild(sec);
  });
}

function toggleItem(item, hasSize) {
  const card = document.getElementById('card-' + item.id);
  if (selected[item.id]) {
    delete selected[item.id];
    card.classList.remove('selected');
  } else {
    let price = hasSize ? null : item.price;
    let size = null;

    // FIX: auto-select the first size (S) so total updates immediately on click
    if (hasSize) {
      const firstSizeEntry = Object.entries(item.sizes)[0];
      size = firstSizeEntry[0];
      price = firstSizeEntry[1];
      // mark that size button as active visually
      const sizeButtons = document.querySelectorAll(`#size-${item.id} .size-btn`);
      sizeButtons.forEach(b => b.classList.remove('active'));
      const defaultBtn = document.querySelector(`#size-${item.id} .size-btn[data-size="${size}"]`);
      if (defaultBtn) defaultBtn.classList.add('active');
    }

    selected[item.id] = { name: item.name, qty: 1, size, price };
    card.classList.add('selected');
  }
  updateTotal();
}

function selectSize(e, id, size, price) {
  e.stopPropagation();
  document.querySelectorAll(`#size-${id} .size-btn`).forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  if (selected[id]) {
    selected[id].size = size;
    selected[id].price = price;
  }
  updateTotal();
}

function changeQty(e, id, delta) {
  e.stopPropagation();
  if (!selected[id]) return;
  selected[id].qty = Math.max(1, (selected[id].qty || 1) + delta);
  document.getElementById('qnum-' + id).textContent = selected[id].qty;
  updateTotal();
}

function updateTotal() {
  let total = 0;
  Object.values(selected).forEach(s => {
    if (s.price) total += s.price * (s.qty || 1);
  });
  document.getElementById('totalAmount').textContent = 'Rs. ' + total.toLocaleString();
}

// ========== MODAL ==========
function openModal() {
  const items = Object.values(selected).filter(s => s.price);
  if (items.length === 0) {
    alert('Pehle koi item select karein!');
    return;
  }
  let summary = '';
  let total = 0;
  items.forEach(s => {
    const line = `• ${s.name}${s.size ? ' (' + s.size + ')' : ''} x${s.qty} = Rs.${(s.price * s.qty).toLocaleString()}`;
    summary += line + '<br>';
    total += s.price * s.qty;
  });
  summary += `<br><strong style="color:#FFD600">Total: Rs.${total.toLocaleString()}</strong>`;
  document.getElementById('orderSummary').innerHTML = summary;
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function sendWhatsApp() {
  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const address = document.getElementById('custAddress').value.trim();

  if (!name || !phone || !address) {
    alert('Naam, phone aur address zaroori hai!');
    return;
  }

  const items = Object.values(selected).filter(s => s.price);
  let total = 0;
  let msg = `🍔 *AQEEL FAST FOOD — NEW ORDER*\n\n`;
  msg += `👤 *Customer:* ${name}\n`;
  msg += `📞 *Phone:* ${phone}\n`;
  msg += `📍 *Address:* ${address}\n\n`;
  msg += `*--- ORDER DETAILS ---*\n`;
  items.forEach(s => {
    const lineTotal = s.price * s.qty;
    msg += `• ${s.name}${s.size ? ' (' + s.size + ')' : ''} x${s.qty} = Rs.${lineTotal.toLocaleString()}\n`;
    total += lineTotal;
  });
  msg += `\n💰 *TOTAL: Rs.${total.toLocaleString()}*\n`;
  msg += `🛵 *Home Delivery FREE*`;

  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
  closeModal();
}

// INIT
renderMenu();
</script>
